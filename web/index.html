<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Tappsy Backend API</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            :root { color-scheme: dark; }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #0b0e14;
                color: #e6edf3;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            }
            main {
                max-width: 520px;
                padding: 2rem 2.25rem;
                border: 1px solid #21262d;
                border-radius: 12px;
                background: #111620;
            }
            h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
            p { margin: 0; color: #8b949e; line-height: 1.6; }
            code {
                background: #1c2333;
                padding: 0.15rem 0.4rem;
                border-radius: 4px;
                color: #79c0ff;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Tappsy Backend</h1>
            <p>Real-time messaging REST &amp; WebSocket server is running. Check health at <code>GET /Test</code> or connect via <code>ws://host/TappsyBackEnd/chat?userId=&lt;id&gt;</code>.</p>
        </main>
    </body>
</html>
